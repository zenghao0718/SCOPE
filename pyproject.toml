[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-cr68-mdn3"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "PyYAML>=6", "pandas>=2", "torch>=2.1", "scikit-learn>=1.3", "lmdb>=1.4", "tensorboard>=2.14"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["data", "features", "models", "losses", "engine", "evaluation"]
